const KEY="ecosystem-economy-action-plan-v1",LANG="ecosystem-economy-language-v1";let lang="en",selected=new Set(),reflection="";
function persist(){try{localStorage.setItem(KEY,JSON.stringify({selected:[...selected],reflection}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");selected=new Set((d.selected||[]).filter(id=>ACTION_PLAN.actions.some(a=>a.id===id)));reflection=typeof d.reflection==="string"?d.reflection:""}catch(e){}try{const v=localStorage.getItem(LANG);if(["en","fil","bik"].includes(v))lang=v}catch(e){}$("reflectionText").value=reflection}
function renderActions(){const host=$("actionGrid");host.innerHTML=ACTION_PLAN.actions.map((a,i)=>{const cat=ACTION_PLAN.categories.find(c=>c.id===a.cat);return `<article class="action ${selected.has(a.id)?"checked":""}" data-id="${esc(a.id)}"><div class="action-top"><input class="check" type="checkbox" id="ck-${esc(a.id)}" data-id="${esc(a.id)}" ${selected.has(a.id)?"checked":""} aria-label="${esc(a.title)}"><div style="min-width:0;flex:1"><label class="action-title" for="ck-${esc(a.id)}"><span class="number">${i+1}.</span>${esc(a.title)}</label><br><span class="tag">${esc(cat?tr(cat.name):a.cat)}</span></div></div><p class="action-desc">${esc(a.desc)}</p><p class="action-impact"><b>${lang==="en"?"Possible impact:":lang==="fil"?"Posibleng epekto:":"Posibleng epekto:"}</b> ${esc(a.impact)}</p></article>`}).join("");host.querySelectorAll("input").forEach(el=>el.addEventListener("change",()=>{el.checked?selected.add(el.dataset.id):selected.delete(el.dataset.id);update()}))}
function renderImpact(){const host=$("impactCategories");host.innerHTML=ACTION_PLAN.impactCategories.map(c=>`<div class="impact-item"><div class="impact-head"><span>${esc(tr(c.name))}</span><span id="v-${c.id}">0%</span></div><div class="mini-track"><div class="mini-fill ${c.id==="forest"?"forest":c.id==="pollution"?"pollution":"bio"}" id="b-${c.id}"></div></div><p class="muted" style="font-size:.78rem;margin-top:6px">${esc(tr(c.desc))}</p></div>`).join("")}
function renderLearning(){const ui=UI[lang];$("problemCards").innerHTML=ACTION_PLAN.learning.map(p=>`<article class="problem"><div class="emoji">${p.icon}</div><h3>${esc(tr(p.title))}</h3><p>${esc(tr(p.body))}</p></article>`).join("");$("ecosystemExamples").textContent=ui.examples}
function updateSummary(){const ui=UI[lang],chosen=ACTION_PLAN.actions.filter(a=>selected.has(a.id)),p=$("dynamicSummary"),ul=$("selectedActionsList");if(!chosen.length){p.textContent=ui.none;ul.hidden=true;ul.innerHTML="";$("relatedProblems").textContent="";return}const names=chosen.map(a=>a.title),joined=names.length===1?names[0]:names.slice(0,-1).join(", ")+(lang==="en"?" and ":lang==="fil"?" at ":" asin ")+names.at(-1),keys=[...new Set(chosen.flatMap(a=>a.problems||[]))],benefits=[...new Set(chosen.flatMap(a=>a.benefits||[]))].map(k=>ui.benefits[k]).filter(Boolean);p.textContent=`${lang==="en"?"You completed":lang==="fil"?"Natapos mo ang":"Natapos mo an"} ${chosen.length} ${ui.actions}: ${joined}. ${lang==="en"?"These actions can help":lang==="fil"?"Makakatulong ang mga ito upang":"Makakatabang an mga ini na"} ${benefits.join("; ")}.`;ul.hidden=false;ul.innerHTML=chosen.map(a=>`<li>${esc(a.title)}</li>`).join("");$("relatedProblems").textContent=ui.problems+" "+keys.join(", ").replaceAll("-"," ")}
function update(){const total=ACTION_PLAN.actions.length,done=selected.size,pct=total?Math.round(done/total*100):0;$("totalCount").textContent=total;$("doneCount").textContent=done;$("remainingCount").textContent=total-done;$("percentCount").textContent=pct+"%";$("progressFill").style.width=pct+"%";$("mainProgress").setAttribute("aria-valuenow",pct);$("progressCaption").textContent=pct+"% "+(lang==="en"?"completed":lang==="fil"?"kumpleto":"kumpleto");$("fractionCaption").textContent=`${done} / ${total} ${UI[lang].actions}`;$("completeMessage").classList.toggle("show",total>0&&done===total);$("completeMessage").textContent=UI[lang].allDone;document.querySelectorAll(".action").forEach(el=>el.classList.toggle("checked",selected.has(el.dataset.id)));ACTION_PLAN.impactCategories.forEach(c=>{let rel=ACTION_PLAN.actions.filter(a=>a.benefits.includes(c.id));if(c.id==="biodiversity")rel=ACTION_PLAN.actions.filter(a=>a.benefits.includes("biodiversity"));const n=rel.filter(a=>selected.has(a.id)).length,p=rel.length?Math.round(n/rel.length*100):0;$("b-"+c.id).style.width=p+"%";$("v-"+c.id).textContent=p+"%"});updateSummary();persist()}
